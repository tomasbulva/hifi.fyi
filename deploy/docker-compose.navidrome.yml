# Navidrome + Cloudflare Tunnel only (no Sonos proxy)
# Use this if your Sonos speakers are on a different network than the player,
# or if you don't need Sonos support.
#
# Usage:
#   cp .env.example .env  →  edit values
#   docker compose -f docker-compose.navidrome.yml up -d

version: "3.9"

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "${ND_USER}"
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: "${ND_SCAN_SCHEDULE}"
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
      ND_ENABLETRANSCODINGCONFIG: "true"
      ND_IMAGECACHE_SIZE: "1GB"
    ports:
      - "4533:4533"
    volumes:
      - "${ND_DATA_PATH}:/data"
      - "${ND_MUSIC_PATH}:/music:ro"
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

networks:
  internal:
    driver: bridge
