# hifi — unified deployment
#
# One container: frontend + Navidrome proxy + companion + Sonos
#
# Usage:
#   cp .env.example .env  →  edit values
#   docker compose up -d

version: "3.9"

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "${ND_USER}"
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: "${ND_SCAN_SCHEDULE}"
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
      ND_ENABLETRANSCODINGCONFIG: "true"
      ND_IMAGECACHE_SIZE: "1GB"
    ports:
      - "4533:4533"
    volumes:
      - "${ND_DATA_PATH}:/data"
      - "${ND_MUSIC_PATH}:/music:ro"
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  hifi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hifi
    restart: unless-stopped
    environment:
      - PORT=4321
      - NAVIDROME_URL=http://navidrome:4533
      - NAVIDROME_USER=${COMPANION_USER:-}
      - NAVIDROME_PASSWORD=${COMPANION_PASSWORD:-}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - PROXY_API_KEY=${PROXY_API_KEY:-}
      - HOT_THRESHOLD=${HOT_THRESHOLD:-5}
      - DB_PATH=/data/companion.db
      - NAVIDROME_LAN_URL=${NAVIDROME_LAN_URL:-}
      # ── Observability ──
      - SENTRY_DSN=${SENTRY_DSN:-}
      - RELEASE=${RELEASE:-hifi@dev}
      # Create a website in the Umami UI (http://<host>:3000), paste its ID here
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID:-}
      - UMAMI_URL=http://umami:3000
    ports:
      - "4321:4321"
    volumes:
      - ./hifi-data:/data
    networks:
      - internal
    depends_on:
      - navidrome
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  # Note: For Sonos SSDP discovery to work, run hifi with:
  #   network_mode: host
  # instead of ports mapping. SSDP requires UDP multicast on the local network.

networks:
  internal:
    driver: bridge

  # ── Analytics (Umami) ──
  # First boot: open http://<host>:3000, login (admin/umami), add a website,
  # then set UMAMI_WEBSITE_ID in .env and restart hifi.
  umami-db:
    image: postgres:16-alpine
    container_name: umami-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - ./umami-db:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      # Generate: openssl rand -base64 32
      - APP_SECRET=${UMAMI_APP_SECRET:-change-me-please}
    ports:
      - "3000:3000"
    depends_on:
      - umami-db
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
