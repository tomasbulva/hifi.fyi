# Full stack — Navidrome + Cloudflare Tunnel + Sonos Proxy
# Use this when running everything on the same host (e.g. Synology NAS on same network as Sonos)
#
# Usage:
#   cp .env.example .env  →  edit values
#   docker compose -f docker-compose.full.yml up -d

version: "3.9"

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: "${ND_USER}"
    restart: unless-stopped
    environment:
      ND_SCANSCHEDULE: "${ND_SCAN_SCHEDULE}"
      ND_LOGLEVEL: info
      ND_SESSIONTIMEOUT: 24h
      ND_BASEURL: ""
      ND_ENABLETRANSCODINGCONFIG: "true"
      ND_IMAGECACHE_SIZE: "1GB"
    ports:
      - "4533:4533"
    volumes:
      - "${ND_DATA_PATH}:/data"
      - "${ND_MUSIC_PATH}:/music:ro"
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  sonos-proxy:
    build:
      context: ../sonos
      dockerfile: Dockerfile
    container_name: hifi-sonos-proxy
    restart: unless-stopped
    environment:
      - CAST_PROXY_PORT=${CAST_PROXY_PORT}
      - NAVIDROME_LAN_URL=${NAVIDROME_LAN_URL:-}
      - PROXY_API_KEY=${PROXY_API_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    # Host network is required for SSDP/UPnP discovery of Sonos speakers
    network_mode: host
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  hifi-companion:
    build:
      context: ../companion
      dockerfile: Dockerfile
    container_name: hifi-companion
    restart: unless-stopped
    environment:
      - COMPANION_PORT=4322
      - NAVIDROME_URL=http://navidrome:4533
      - NAVIDROME_USER=${COMPANION_USER:-}
      - NAVIDROME_PASSWORD=${COMPANION_PASSWORD:-}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - PROXY_API_KEY=${PROXY_API_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - HOT_THRESHOLD=${HOT_THRESHOLD:-5}
      - DB_PATH=/data/companion.db
    ports:
      - "4322:4322"
    volumes:
      - ./companion-data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

networks:
  internal:
    driver: bridge
